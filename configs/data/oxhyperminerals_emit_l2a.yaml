_target_: src.datamodules.oxhyperminerals_emit_l2a_datamodule.OxHyperMineralsEMITL2ADataModule

defaults:
  - /sensor@sensor_config: emit

product: "oxhyperminerals_emit_l2a"
label_product: "minerals3ghk"
class_names: ["Goethite", "Hematite", "Kaolinite"]

# Multi-label target bands on disk:
# minerals3ghk -> [Goethite, Hematite, Kaolinite]
# minerals10   -> [Calcite, Chlorite, Dolomite, Goethite, Gypsum, Hematite,
#                  Illite+Muscovite, Kaolinite, Montmorillonite, Vermiculite]
#
# Pixels may activate multiple mineral bands simultaneously.
classes: [0, 1, 2]
raw_ignore_value: 255
ignore_value: -1.0
invalid_value: -9999.0
image_fill_value: 0.0

# Patchify script output root. NOT under ${paths.data_dir} -- this dataset
# lives in its own top-level location, confirmed to match the split files
# already checked into data/splits/oxhyperminerals_emit_l2a/ (exact tile
# counts: train=48792, val=12094, test=12373, matching metadata/dataset_summary.json).
root: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0001/oxhyperminerals_emit_l2a_author64_valid99
split_root: data/splits

apply_input_normalization: true
standardize: false
standardization_mode: bandwise
standardization_stats_path: null
standardization_eps: 1.0e-6
target_sensor_config: null

batch_size: 16
img_size: 64
num_workers: 4

num_classes: 3
ignore_index: null
